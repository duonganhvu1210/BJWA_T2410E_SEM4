<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Salary Management</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">

    <!-- FORM CREATE / EDIT -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">User</h5>

            <!-- Thông báo thành công / lỗi -->
            <div th:if="${message}" class="alert"
                 th:classappend="${message.startsWith('Error') ? 'alert-danger' : 'alert-success'}"
                 th:text="${message}"></div>

            <!-- Form thêm hoặc edit -->
            <form th:action="${editMode != null ? '/users/update' : '/users/add'}"
                  th:object="${user}" method="post">
                <input type="hidden" th:field="*{id}" th:if="${editMode != null}"/>

                <div class="mb-2 row">
                    <label class="col-sm-2 col-form-label">Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" th:field="*{name}"
                               placeholder="Enter your name">
                        <small class="text-danger" th:if="${#fields.hasErrors('name')}"
                               th:errors="*{name}"></small>
                    </div>
                </div>

                <div class="mb-2 row">
                    <label class="col-sm-2 col-form-label">Age</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" th:field="*{age}"
                               placeholder="Enter your Age">
                        <small class="text-danger" th:if="${#fields.hasErrors('age')}"
                               th:errors="*{age}"></small>
                    </div>
                </div>

                <div class="mb-2 row">
                    <label class="col-sm-2 col-form-label">Salary</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" th:field="*{salary}"
                               placeholder="Enter your Salary">
                        <small class="text-danger" th:if="${#fields.hasErrors('salary')}"
                               th:errors="*{salary}"></small>
                    </div>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-success"
                            th:text="${editMode != null ? 'Update' : 'Add'}">Add</button>
                    <button type="reset" class="btn btn-secondary">Reset Form</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SEARCH BAR -->
    <form action="/users" method="get" class="mb-3 d-flex gap-2">
        <input type="text" name="keyword" class="form-control"
               placeholder="Search by name..." th:value="${keyword}">
        <button type="submit" class="btn btn-primary">Search</button>
        <a href="/users" class="btn btn-outline-secondary">Clear</a>
    </form>

    <!-- DANH SÁCH USER -->
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">List of Users</h5>
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th><th>NAME</th><th>AGE</th><th>SALARY</th><th>ACTION</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.name}"></td>
                    <td th:text="${u.age}"></td>
                    <td th:text="${u.salary}"></td>
                    <td>
                        <a th:href="@{/users/edit/{id}(id=${u.id})}"
                           class="btn btn-sm btn-warning">Edit</a>
                        <a th:href="@{/users/delete/{id}(id=${u.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure?')">Remove</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="5" class="text-center text-muted">No users found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
